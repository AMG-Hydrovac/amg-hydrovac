# Netlify continuous deployment for amghydrovac.ca
# Static site plus one serverless function (rate-sheet email). The build command embeds the
# PDF code + font into the function, then keeps config files out of the published site.
[build]
  publish = "."
  command = "node netlify/embed.js && rm -f netlify.toml .gitignore"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
